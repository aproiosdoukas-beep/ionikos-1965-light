<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Σύνδεση · Ιωνικός 1965</title>
<meta name="description" content="Σύνδεση μέλους στην επίσημη εφαρμογή του Ιωνικού Νικαίας 1965.">
<link rel="icon" href="assets/img/crest.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:wdth,wght@62.5..100,500..900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css?v=20261107s">
<link rel="stylesheet" href="assets/css/components.css?v=20261107s">
<link rel="stylesheet" href="assets/css/shell.css?v=20261107s">
</head>
<body>

<main class="auth theme-dark crest-watermark">
  <div class="auth__card theme-light">
    <div class="auth__head">
      <img class="crest crest--lg" src="assets/img/crest.svg" alt="Έμβλημα Ιωνικού">
      <div style="display:grid;gap:8px;justify-items:center">
        <h1 class="auth__title">Ιωνικός Νικαίας</h1>
        <span class="seal">ΑΠΟ ΤΟ 1965</span>
        <p class="auth__sub" style="margin:0">Σύνδεση μέλους στην εφαρμογή του συλλόγου</p>
      </div>
    </div>

    <hr class="divider">

    <form id="loginForm" class="stack" novalidate>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="input" id="email" name="email" type="email"
               autocomplete="username" placeholder="email@example.gr" required>
      </div>

      <div class="field">
        <label class="field__label" for="password">Κωδικός πρόσβασης</label>
        <input class="input" id="password" name="password" type="password"
               autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <p id="formError" class="field__error hidden" role="alert"></p>

      <button class="btn btn--primary btn--lg btn--block" type="submit">ΣΥΝΔΕΣΗ</button>
      <button class="btn btn--ghost btn--block" type="button" id="guestBtn">Συνέχεια ως επισκέπτης</button>
    </form>

    <hr class="divider">

    <div class="auth__demos">
      <p class="t-sm muted bold display" style="margin:0">
        Λογαριασμοί επίδειξης: πατήστε έναν για συμπλήρωση
      </p>
      <div id="demoList" class="stack-2"></div>
    </div>
  </div>
</main>

<script src="assets/js/data.js?v=20261107s"></script>
<script src="assets/js/core.js?v=20261107s"></script>
<script>
(function () {
  "use strict";
  const { Auth, $, el, toast } = window.ION;

  const HOME_BY_ROLE = {
    member:   "app.html",
    admin:    "admin.html",
    gate:     "scanner.html",
    merchant: "merchant.html"
  };

  /* Ετικέτα ανά λογαριασμό: δύο είδη μέλους, μετά οι ρόλοι προσωπικού. */
  const DEMO_LABELS = {
    u_maria:   "Μέλος",
    u_giorgos: "Μέλος με παιδί ακαδημίας",
    u_admin:   "Γραφείο συλλόγου",
    u_gate:    "Προσωπικό θύρας",
    u_shop:    "Κατάστημα χορηγός"
  };

  /* ---- Λίστα demo λογαριασμών ---- */
  const list = $("#demoList");
  window.ION_DATA.ACCOUNTS.forEach(acc => {
    list.appendChild(
      el("button", {
        class: "auth__demo",
        type: "button",
        onclick() {
          $("#email").value = acc.email;
          $("#password").value = acc.password;
          $("#formError").classList.add("hidden");
          $("#password").focus();
        }
      }, [
        el("b", { text: DEMO_LABELS[acc.id] || acc.displayName }),
        el("span", { text: acc.email })
      ])
    );
  });

  /* ---- Υποβολή ---- */
  $("#loginForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    const errBox = $("#formError");
    const res = Auth.login($("#email").value, $("#password").value);

    if (!res.ok) {
      errBox.textContent = res.error;
      errBox.classList.remove("hidden");
      $("#password").classList.add("input--error");
      return;
    }

    errBox.classList.add("hidden");
    $("#password").classList.remove("input--error");

    const params = new URLSearchParams(location.search);
    const next = params.get("next");
    const home = HOME_BY_ROLE[res.account.role] || "app.html";
    location.href = next && /^[a-z0-9_-]+\.html$/i.test(next) ? next : home;
  });

  $("#guestBtn").addEventListener("click", function () {
    location.href = "web.html";
  });

  /* ---- Ήδη συνδεδεμένος; ---- */
  const existing = Auth.account();
  if (existing) {
    toast("Είστε ήδη συνδεδεμένοι ως " + existing.displayName, "ok");
    $("#email").value = existing.email;
  }
})();
</script>
</body>
</html>
